<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Red bokeh gradient -->
    <radialGradient id="redBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(255,100,100);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(255,50,50);stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:rgb(255,0,0);stop-opacity:0" />
    </radialGradient>
    
    <!-- Green bokeh gradient -->
    <radialGradient id="greenBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(150,255,150);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(50,255,100);stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:rgb(0,255,50);stop-opacity:0" />
    </radialGradient>
    
    <!-- Blue bokeh gradient -->
    <radialGradient id="blueBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(150,180,255);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(100,150,255);stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:rgb(50,100,255);stop-opacity:0" />
    </radialGradient>
    
    <!-- Gold bokeh gradient -->
    <radialGradient id="goldBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(255,235,150);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(255,215,100);stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:rgb(255,200,50);stop-opacity:0" />
    </radialGradient>
    
    <!-- Purple bokeh gradient -->
    <radialGradient id="purpleBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(220,150,255);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(200,100,255);stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:rgb(150,50,255);stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="100" height="100" fill="#0a1517"/>
  
  <!-- Multiple overlapping bokeh circles in different colors -->
  <circle cx="30" cy="35" r="20" fill="url(#redBokeh)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="65" cy="30" r="18" fill="url(#greenBokeh)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="50" cy="55" r="22" fill="url(#goldBokeh)" filter="url(#glow)" opacity="0.8"/>
  <circle cx="25" cy="65" r="16" fill="url(#blueBokeh)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="70" cy="65" r="19" fill="url(#purpleBokeh)" filter="url(#glow)" opacity="0.7"/>
</svg>
